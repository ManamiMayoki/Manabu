services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: manabu_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=manabu_db
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # 2. Backend Service (Express + Node + Mongoose)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/manabu_db
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. Frontend Service (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
