name: API Automated Tests & Quality Checks

on:
  push:
    branches: [ development, release, production ]
  pull_request:
    branches: [ development, release, production ]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Spin Up MongoDB & Backend Containers
        run: |
          docker compose up -d --build mongodb backend
          docker compose ps

      - name: Wait for Services to be Ready
        run: sleep 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      # --- Week 3 Module Automated Tests ---
      - name: Run Event Module Tests
        run: |
          newman run tests/postman_week3/Event_tests.json -r cli,htmlextra --reporter-htmlextra-export newman/Event_report.html || true

      - name: Run Festival Module Tests
        run: |
          newman run tests/postman_week3/Festival_tests.json -r cli,htmlextra --reporter-htmlextra-export newman/Festival_report.html || true

      - name: Run Organizer Module Tests
        run: |
          newman run tests/postman_week3/Organizer_tests.json -r cli,htmlextra --reporter-htmlextra-export newman/Organizer_report.html || true

      - name: Run Registration Module Tests
        run: |
          newman run tests/postman_week3/Registration_tests.json -r cli,htmlextra --reporter-htmlextra-export newman/Registration_report.html || true

      # --- Core / Quality Tests ---
      - name: Run PM Postman Tests
        run: |
          newman run tests/postman/PM_tests.json -e tests/postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman/PM_report.html || true

      - name: Run SQA Postman Tests
        run: |
          newman run tests/postman/SQA_tests.json -e tests/postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman/SQA_report.html || true

      - name: Upload Test Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-reports
          path: newman/

      - name: Tear Down Docker Containers
        if: always()
        run: docker compose down -v
