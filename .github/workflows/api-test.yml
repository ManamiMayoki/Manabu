name: API Automated Tests & Quality Checks

on:
  push:
    branches: [ development, release, production ]
  pull_request:
    branches: [ development, release, production ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run PM Postman Tests
        run: |
          newman run postman/PM_tests.json -e postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman/PM_report.html || true

      - name: Run SQA Postman Tests
        run: |
          newman run postman/SQA_tests.json -e postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman/SQA_report.html || true

      - name: Run Backend Postman Tests
        run: |
          newman run postman/Backend_tests.json -e postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman/Backend_report.html || true

      - name: Run Frontend Postman Tests
        run: |
          newman run postman/Frontend_tests.json -e postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman/Frontend_report.html || true

      - name: Upload Test Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-reports
          path: newman/