name: API Automated Tests & Quality Checks

on:
  push:
    branches: [ development, release, production ]
  pull_request:
    branches: [ development, release, production ]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      # --- Week 3 Module Tests ---
      - name: Run Event Module Tests
        run: |
          newman run tests/postman_week3/Event_tests.json --env-var "baseUrl=http://103.191.241.110:5000" -r cli,htmlextra --reporter-htmlextra-export newman/Event_report.html || true

      - name: Run Festival Module Tests
        run: |
          newman run tests/postman_week3/Festival_tests.json --env-var "baseUrl=http://103.191.241.110:5000" -r cli,htmlextra --reporter-htmlextra-export newman/Festival_report.html || true

      - name: Run Organizer Module Tests
        run: |
          newman run tests/postman_week3/Organizer_tests.json --env-var "baseUrl=http://103.191.241.110:5000" -r cli,htmlextra --reporter-htmlextra-export newman/Organizer_report.html || true

      - name: Run Registration Module Tests
        run: |
          newman run tests/postman_week3/Registration_tests.json --env-var "baseUrl=http://103.191.241.110:5000" -r cli,htmlextra --reporter-htmlextra-export newman/Registration_report.html || true

      - name: Upload Test Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-reports
          path: newman/
